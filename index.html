<!DOCTYPE html>
<!--

* PURPOSE: This is the main index.html that loads the main app
-->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDraft | Screenwriting</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="board.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-512.png">

    <script src="./fountain2026.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="board.js"></script>
    <script src="update.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log("Service Worker Registered"))
          .catch(err => console.log("Service Worker Failed", err));
      }
    </script>
    <script>
        //Current Version: Please change every update. This should match exactly with the version in version.json
        window.APP_VERSION = "2026.01.20.1542";
    </script>

</head>
<body>

<div class="app-container">
    <nav class="top-nav">
        <div style="display: flex; align-items: center; flex-shrink: 0;">
            <button class="btn-icon" id="toggleLibraryBtn" title="Project Library" style="margin-right: 10px;">
                <span class="material-symbols-outlined">library_books</span>
            </button>
            <div class="brand">
                <img src="./icon-512.png" alt="OpenDraft Logo" height="32px">
                <span class="logo-text">Open<b>Draft</b></span>
            </div>
        </div>

        <div class="actions">
            <button id="mobile-toggle" class="btn btn-primary mobile-only" title="Toggle Preview (Ctrl+;)">
                <span class="material-symbols-outlined">visibility</span>
            </button>

            <div class="nav-menu" id="navMenu">
                <div class="control-group">
                    <button class="btn-icon" id="decreaseFont" title="Decrease Font (Ctrl+[)"><span class="material-symbols-outlined">remove</span></button>
                    <span id="fontSizeDisplay">18px</span>
                    <button class="btn-icon" id="increaseFont" title="Increase Font (Ctrl+])"><span class="material-symbols-outlined">add</span></button>
                </div>
                <button class="btn" id="openBtn" title="Open from File (Ctrl+O)">
                    <span class="material-symbols-outlined">file_open</span>
                    <span>Open</span>
                </button>
                <button class="btn" id="saveBtn" title="Save to File (Ctrl+S)">
                    <span class="material-symbols-outlined">save</span>
                    <span>Save</span>
                </button>
                <button class="btn" id="outlineBtn" title="Toggle Outline (Ctrl+\)">
                    <span class="material-symbols-outlined">format_list_bulleted</span><span>Outliner</span>
                </button>
                <button id="boardToggleBtn" class="btn btn-primary" title="Open Scene Board">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span class="toggle-text">Board</span>
                </button>
                <button class="btn" id="toggleNotesBtn" title="Toggele Notes (Ctrl+M)">
                    <span class="material-symbols-outlined">description</span>
                    <span>Notes</span>
                </button>
                <button class="btn" onclick="window.print()" title="Print (Ctrl+P)">
                    <span class="material-symbols-outlined">print</span>
                    <span>PDF</span>
                </button>
                <button class="btn" id="aboutBtn">
                    <span class="material-symbols-outlined">info</span>
                    <span>About</span>
                </button>
            </div>

            <button class="btn-icon mobile-only" id="burger-btn">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </nav>
    <div class="main-workspace">
  <!-- RIGHT NAV -->
  <div id="outlineSidebar" class="sidebar-right">
      <div class="sidebar-header">
          <h3>Outline</h3>
          <button id="closeOutlineBtn" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <div id="outlineList">
          </div>
  </div>
  <!-- LEFT NAV -->
      <div id="librarySidebar" class="sidebar-left">
          <div class="sidebar-header">
              <h3>My Scripts</h3>
              <button id="closeLibraryBtn" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
          </div>

          <div id="scriptList"></div>

          <button class="btn-primary sidebar-btn" id="createNewBtn" style="background:#676799">
              <span class="material-symbols-outlined">add</span> New Script
          </button>

          <button class="btn-primary sidebar-btn" onclick="exportAllScripts()">
              <span class="material-symbols-outlined">download</span> Export All
          </button>

          <input type="file" id="importScriptsInput" style="display:none" accept=".json" onchange="importAllScripts(event)">

          <button class="btn-primary sidebar-btn" onclick="document.getElementById('importScriptsInput').click()">
              <span class="material-symbols-outlined">upload</span> Import Backup
          </button>
      </div>


  <!-- TEXTAREA SECTION -->

      <div class="container">
          <div class="editor-pane">
              <textarea id="editor" placeholder="Type your Fountain script here..."></textarea>
          </div>

          <div class="viewer-pane">
          <div id="output"></div>
        </div>
      </div>

    <div class="floating-status">
        <span id="currentActiveTitle" >No script active</span>
        <span id="page-count-display" style="margin-left: 20px; color: #0fa9e5; font-weight: bold;">0</span>
    </div>
  </div>


  <div id="board-pane" style="display: none;">
    <div class="board-header">
        <div class="board-title-group">
            <span class="material-symbols-outlined" style="color: #0fa9e5;">dashboard</span>
            <h2 id="boardScriptTitle">Board</h2>
        </div>
        <div class="board-actions">
            <button id="commitBoardBtn" class="btn btn-primary">
                <span class="material-symbols-outlined">check_circle</span>&nbsp;Update Script & Exit
            </button>
            <button id="closeBoardBtn" class="btn">
                <span class="material-symbols-outlined">cancel</span>&nbsp;Exit Without Saving
            </button>
        </div>
    </div>

    <div id="card-container">
        </div>
</div>

  <dialog id="aboutDialog" class="about-modal">
    <div class="modal-content">
        <button id="closeAboutBtn" class="close-modal">&times;</button>

        <img src="./icon-512.png" alt="OpenDraft Logo" class="about-logo">
        <h2 class="about-title"><span class="logo-text">Open<b>Draft</b></span></h2>
        <span class="version-badge">v2026.01.20.1542</span>

        <div class="about-info">
            <p>Created by <strong>Vinimay Kaul</strong></p>
            <p class="location">Arctropics OU, Tallinn, Estonia</p>
        </div>

        <hr>

        <div class="about-links">
            <p><a href="https://fountain.io/syntax/" target="_blank">
                <span class="material-symbols-outlined">menu_book</span> Fountain Syntax Guide
            </a></p>
            <p><a href="https://files.commons.gc.cuny.edu/wp-content/blogs.dir/4120/files/2018/08/Three-Act-Structure.Jim-Soto-glosses-SYD_FIELD.pdf" target="_blank">
                <span class="material-symbols-outlined">School</span> The Syd Field Paradigm
            </a></p>
        </div>

        <hr>

        <p class="license">
            <strong>100% Free & Open Source</strong><br>
            <a href="https://opensource.org/license/mit" target="_blank">MIT License</a>
        </p>
    </div>
</dialog>

  <script src="script.js"></script>
  </body>
</html>
